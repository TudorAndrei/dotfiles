BACKGROUND="#282A36"
FG="#F8F8F2"
SELECTION="#44475A"
COMMENT="#6272A4"
PURPLE="#BD93F9"
RED="#FF5555"
GREEN="#50FA7B"
YELLOW="#F1FA8C"
ORANGE="#FFB86C"
CYAN="#8BE9FD"
PINK="#FF79C6"

set -g default-terminal "tmux-256color"
set -g extended-keys on
set -g detach-on-destroy on
set -g extended-keys-format csi-u
set -g history-limit 100000
set -ag update-environment " HYPRLAND_INSTANCE_SIGNATURE WAYLAND_DISPLAY DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE OZONE_PLATFORM_HINT OZONE_PLATFORM ELECTRON_OZONE_PLATFORM_HINT"

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# renumber-windows only fires when a window closes, so moving a window (prefix
# + . , break-pane, or any move-window) leaves a gap in the numbering. There is
# no after-move-window hook, but move-window is implemented as link + unlink,
# so window-unlinked catches it. `move-window -r` renumbers the session
# sequentially; tmux suppresses hooks fired from inside a hook, so no recursion.
set-hook -g window-unlinked 'move-window -r'

# Follow the pane title (OSC 0/2) for window names. Claude Code and friends
# write their session title there, so the window renames itself as the session
# summary changes. `bind n` (rename-window) still wins: a manual name turns
# automatic-rename off for that window.
set -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{!=:#{pane_title},#{host_short}},#{pane_title},#{pane_current_command}}}'

unbind C-b
set -g prefix C-Space
unbind r
# Force a full client redraw. Use this to unstick a pane that's frozen on a
# blank/stale frame (seen with codex/pi) instead of opening the session list.
bind-key r refresh-client
set -g mouse on
bind-key x kill-pane
set -g detach-on-destroy off

bind-key R run-shell ' \
        tmux source-file ~/.tmux.conf > /dev/null; \
        tmux display-message "sourced ~/.tmux.conf"'

unbind %
unbind '"'
unbind v
unbind h

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind L display-popup -E -d "#{pane_current_path}" "$HOME/.config/tmux/worktree-session-picker.sh"

bind Tab switch-client -l

bind-key S run-shell 'tmux save-buffer - | tmux load-buffer -'
bind-key C-s run-shell -b 'test -d ~/.tmux/plugins/tmux-resurrect && tmux display-message "Saving session..." && ~/.tmux/plugins/tmux-resurrect/scripts/save.sh || tmux display-message "Install plugins with prefix + I"'
bind-key C-r run-shell -b 'test -d ~/.tmux/plugins/tmux-resurrect && tmux display-message "Restoring session..." && ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh || tmux display-message "Install plugins with prefix + I"'

unbind n
unbind w
bind n command-prompt "rename-window '%%'"

set-window-option -g status-keys vi
set-window-option -g mode-keys vi
set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'
set -g focus-events on

set -g status-interval 5
set -g status on
set -g status-justify absolute-centre
set -g status-left-length 80
set -g status-right-length 80

set -g status-style "fg=$FG,bg=$BACKGROUND,none"
set -g pane-border-style "fg=$SELECTION,bg=$BACKGROUND"
set -g pane-active-border-style "fg=$CYAN,bg=$BACKGROUND"
set -g display-panes-colour "$COMMENT"
set -g display-panes-active-colour "$CYAN"
setw -g clock-mode-colour "$PURPLE"
set -g message-style "fg=$FG,bg=$SELECTION"
set -g message-command-style "fg=$FG,bg=$SELECTION"

set -g window-status-format "#[fg=$COMMENT,bg=$BACKGROUND,nobold,noitalics,nounderscore] #[fg=$FG,bg=$BACKGROUND]#I#[fg=$COMMENT,bg=$BACKGROUND,nobold,noitalics,nounderscore] #[fg=$FG,bg=$BACKGROUND]#W "
set -g window-status-current-format "#[fg=$BACKGROUND,bg=$CYAN,nobold,noitalics,nounderscore] #[fg=$BACKGROUND,bg=$CYAN]#I#[fg=$BACKGROUND,bg=$CYAN,nobold,noitalics,nounderscore] #[fg=$BACKGROUND,bg=$CYAN]#W "
set -g window-status-separator ""

set -g status-left "#[fg=$BACKGROUND,bg=$PURPLE,bold] #S#(git -C '#{pane_current_path}' rev-parse --git-dir 2>/dev/null | grep -q /worktrees/ || git -C '#{pane_current_path}' symbolic-ref --short HEAD 2>/dev/null | sed 's/.*/ (&)/') #[fg=$PURPLE,bg=$COMMENT,nobold]#[fg=$FG,bg=$COMMENT] #H #[fg=$CYAN,bg=$COMMENT]#{pane_id} #[fg=$COMMENT,bg=$BACKGROUND,nobold]"
set -g status-right "#[fg=$FG,bg=$COMMENT] %Y-%m-%d #[fg=$PURPLE,bg=$COMMENT]#[fg=$BACKGROUND,bg=$PURPLE,bold] %H:%M "

set -g @plugin tmux-plugins/tpm
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
set -g @plugin tmux-plugins/tmux-sensible
set -g @plugin tmux-plugins/tmux-yank
set -g @plugin tmux-plugins/tmux-open
set -g @plugin christoomey/vim-tmux-navigator
set -g @plugin pschmitt/tmux-ssh-split
set -g @plugin tmux-plugins/tmux-resurrect
set -g @plugin tmux-plugins/tmux-continuum
set -g @plugin TudorAndrei/amux
set -g @amux-status off
set -g @amux-picker-key "l"

set -g @ssh-split-h-key "v"
set -g @ssh-split-v-key "h"
set -g @ssh-split-w-key "c"
set -g @ssh-split-keep-cwd "true"
set -g @ssh-split-keep-remote-cwd "true"
set -g @ssh-split-strip-cmd "true"
set -g @ssh-split-fail "false"

set -ga terminal-overrides ",*:Tc"
set -ga terminal-features "*:hyperlinks"
# Disable synchronized-output (DECSET 2026) passthrough: tmux defers flushing
# a pane until it sees the closing ESC[?2026l or a 1s timeout. Codex/Pi (Ink
# renderers) occasionally drop the closing sequence, leaving the pane frozen
# on a blank/stale frame until something else (e.g. a popup close) forces a
# full redraw. Cancelling the Sync capability makes tmux flush immediately.
set -ga terminal-overrides ",*:Sync@"

set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh'
set -g @resurrect-save-bash-history 'on'
set -g @resurrect-save-shell-history 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-vi 'session'
set -g @resurrect-dir '~/.local/state/tmux/resurrect'
set -g @resurrect-delete-backup-after '2'

set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'


run /opt/homebrew/opt/tpm/share/tpm/tpm

bind-key v run-shell "TMUX_PANE='#{pane_id}' ~/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh -c '#{pane_current_path}' --keep-remote-cwd --strip-cmd -h"
bind-key h run-shell "TMUX_PANE='#{pane_id}' ~/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh -c '#{pane_current_path}' --keep-remote-cwd --strip-cmd -v"
bind-key c run-shell "TMUX_PANE='#{pane_id}' ~/.tmux/plugins/tmux-ssh-split/scripts/tmux-ssh-split.sh -c '#{pane_current_path}' --keep-remote-cwd --strip-cmd --window"
bind-key l run-shell "tmux display-popup -c '#{client_tty}' -w '90%' -h '80%' -E 'AMUX_TMUX_CLIENT=#{client_tty} exec \"/Users/tudor/.tmux/plugins/amux/bin/amux\" picker'"
