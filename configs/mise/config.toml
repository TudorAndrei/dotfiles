[tools."github:Wilfred/difftastic"]
version = "latest"
asset_pattern = 'difft-{{ version }}-{{ arch(x64="x86_64", arm64="aarch64") }}-{{ os(macos="apple-darwin", linux="unknown-linux-gnu") }}.tar.gz'

[tools."http:bend"]
version = "2.0.5"
url = "https://bend-lang.com/dl/{{version}}.tar.gz"
checksum = "sha256:4db70e77ce1b1027f1d0e15dee025921fa794a9b415add4350ec7c64acf2775b"
bin_path = "bend2"
postinstall = 'ln -sfn main.ts "$MISE_TOOL_INSTALL_PATH/bend2/bend"'

[settings]
auto_update = true
npm.package_manager = "aube"
experimental = true
minimum_release_age = "0s"

[settings.cargo]
binstall = true

[hooks]
postinstall = "misecompsync --shell zsh"
