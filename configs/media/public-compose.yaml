services:
  public-gateway:
    image: nginx@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    volumes:
      - /srv/media/config/public/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8082:8080"
    depends_on:
      - seedstrem
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
