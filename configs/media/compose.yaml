name: media
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Bucharest
      WEBUI_PORT: "8080"
      TORRENTING_PORT: "6881"
    volumes:
      - /srv/media/config/qbittorrent:/config
      - /srv/media/downloads:/downloads
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    restart: unless-stopped
    logging: *logging
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Bucharest
    volumes:
      - /srv/media/config/prowlarr:/config
    ports:
      - "9696:9696"
    restart: unless-stopped
    logging: *logging
  seedstrem:
    image: local/seedstrem:dd04439e1b3ce0731168feb2b92a2bb66ca94718
    build:
      context: /opt/seedstrem-source
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Bucharest
    volumes:
      - /srv/media/config/seedstrem:/config
      - /srv/media/downloads:/data
    ports:
      - "8081:8080"
    depends_on:
      - qbittorrent
      - prowlarr
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "/seedstrem", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
