$terminal = sh -lc '${TERMINAL:-alacritty}'
$fileManager = dolphin
$menu = vicinae toggle
$mainMod = SUPER

monitor = eDP-2, 2560x1440@240, 0x0, 1.0
monitor=Unknown-1, disable

env = XCURSOR_SIZE,24
env = NVD_BACKEND,direct
env = CLIPHIST,2
env = HYPRCURSOR_SIZE,50
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct

exec-once = nm-applet
exec-once = dbus-update-activation-environment --systemd --all
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = rog-control-center
exec-once = wl-paste --watch cliphist store
exec-once = wl-paste --primary --watch cliphist store
exec-once = swaync
exec-once = waybar
exec-once = vicinae server
exec-once = zen-browser
exec-once = easyeffects
exec-once = pkill -x swaybg; swaybg -i /home/tudor/Pictures/walls/michelangelo-the-creation-of-adam.jpg -m fill
exec-once = [workspace special:notes silent] /home/tudor/dotfiles/configs/hypr/scripts/open-notes-nvim.sh

general {
    gaps_in = 5
    gaps_out = 20
    border_size = 2
    resize_on_border = false
    allow_tearing = false
    layout = "dwindle"
}

cursor {
    no_hardware_cursors = false
}

decoration {
    rounding = 5
    active_opacity = 1.0
    inactive_opacity = 1.0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

misc {
    vfr = true
    focus_on_activate = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = "master"
}

input {
    kb_layout = us
    kb_variant = 
    kb_model = 
    kb_options = caps:escape
    kb_rules = 
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        scroll_factor = 0.2
    }
}

windowrule = workspace 1, match:class ^(zen-alpha)$
windowrule = workspace 7, match:class ^(steam)$
windowrule = workspace 9, match:class ^(signal)$
windowrule = workspace 9, match:class ^(Signal)$
windowrule = workspace 9, match:class ^(discord)$
windowrule = workspace 9, match:class ^(veskop)$
windowrule = workspace special:telegram, match:class ^(org.telegram.desktop)$
windowrule = workspace 4, match:class ^(Zotero)$
windowrule = workspace 10, match:class ^(com.github.wwmm.easyeffects)$
windowrule = workspace 10, match:class ^(spotify)$
windowrule = workspace 10, match:class ^(org.strawberrymusicplayer.strawberry)$
windowrule = suppress_event maximize, match:class .*

layerrule = blur on, match:namespace vicinae
layerrule = ignore_alpha 0.79, match:namespace vicinae
layerrule = animation slide, match:namespace vicinae

bind = $mainMod, Return, exec, $terminal
bind = $mainMod_SHIFT, Q, killactive,
bind = $mainMod, D, exec, $menu
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, F, fullscreen
bind = $mainMod, R, exec, killall waybar && waybar

bind = $mainMod_SHIFT, H, movewindow, l
bind = $mainMod_SHIFT, L, movewindow, r
bind = $mainMod_SHIFT, K, movewindow, u
bind = $mainMod_SHIFT, J, movewindow, d

bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic
bind = $mainMod SHIFT, comma, movecurrentworkspacetomonitor, l
bind = $mainMod SHIFT, period, movecurrentworkspacetomonitor, r
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, P, exec, grimblast copysave active
bind = $mainMod SHIFT, P, exec, grimblast copysave area
bind = $mainMod ALT, P, exec, grimblast copysave output
bind = $mainMod CTRL, P, exec, grimblast copysave screen

bind = $mainMod, N, togglespecialworkspace, notes
bind = $mainMod SHIFT, N, movetoworkspacesilent, special:notes
bind = $mainMod, C, togglespecialworkspace, telegram
bind = $mainMod SHIFT, C, movetoworkspacesilent, special:telegram

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
