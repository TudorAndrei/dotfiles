onboarding = false

[theme]
name = "dracula"

[theme.custom]
accent = "#8BE9FD"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"

help = "prefix+?"
settings = "prefix+s"
detach = "prefix+q"
reload_config = "prefix+shift+r"
toggle_sidebar = "prefix+b"

workspace_picker = ""
goto = "prefix+g"
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
new_worktree = "prefix+shift+g"
switch_workspace = "prefix+shift+1..9"

new_tab = "prefix+c"
rename_tab = "prefix+n"
previous_tab = "prefix+p"
next_tab = ""
switch_tab = "prefix+1..9"
close_tab = "prefix+shift+x"

split_vertical = "prefix+v"
split_horizontal = "prefix+h"
close_pane = "prefix+x"
zoom = "prefix+z"
resize_mode = "prefix+r"
rename_pane = "prefix+shift+p"
edit_scrollback = "prefix+["

focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""
cycle_pane_next = ""
cycle_pane_previous = ""

navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_right = "l"
navigate_pane_up = ""
navigate_pane_down = ""

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+l"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+tab"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "last workspace"

[[keys.command]]
key = "prefix+shift+l"
type = "plugin_action"
command = "worktrunk.open"
description = "worktree picker"

[[keys.command]]
key = "prefix+ctrl+s"
type = "plugin_action"
command = "ntindle.herdr-resurrect.save"
description = "save session snapshot"

[[keys.command]]
key = "prefix+ctrl+r"
type = "plugin_action"
command = "ntindle.herdr-resurrect.restore"
description = "restore session snapshot"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "hotchpotch.herdr-tiny-fingers.open"
description = "copy hints"

[ui]
sidebar_start_collapsed = true
sidebar_collapsed_mode = "hidden"
mouse_capture = true
copy_on_select = true
pane_borders = true
pane_gaps = false
prompt_new_tab_name = false
prompt_new_workspace_name = false
confirm_close = true
hide_tab_bar_when_single_tab = false
tab_bar_position = "top"
agent_panel_sort = "spaces"
accent = "#8BE9FD"

[ui.sidebar.agents]
rows = [
  ["state_icon", "workspace", "tab"],
  ["terminal_title_stripped"],
  ["agent"],
]

[ui.sidebar.spaces]
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
]

[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
pane_history = true

[advanced]
scrollback_limit_bytes = 50000000
