[tools]
bitwarden = "latest"
just = "latest"
"npm:ctx7" = "latest"

[bootstrap.hooks]
post-defaults = "killall Dock || true"
post-packages = '''
case "$(uname -s)" in
  Darwin)
    bash "$HOME/dotfiles/scripts/macos/install.sh"
    ;;
  Linux)
    . /etc/os-release 2>/dev/null || true
    case "${ID:-unknown} ${ID_LIKE:-}" in
      *debian*|*ubuntu*)
        bash "$HOME/dotfiles/scripts/debian/install.sh"
        ;;
    esac
    ;;
esac
'''
post-dotfiles = '''
if [ "$(uname -s)" = "Darwin" ]; then
  agent="com.tudor.ghostty-config-reload"
  plist="$HOME/Library/LaunchAgents/$agent.plist"
  if [ -e "$plist" ]; then
    launchctl bootout "gui/$(id -u)/$agent" 2>/dev/null || true
    launchctl bootstrap "gui/$(id -u)" "$plist"
  fi
fi
'''

[bootstrap.macos.dock]
autohide = true
autohide_delay = 1000000.0
autohide_time_modifier = 0.0
tilesize = 1
show_recents = false
orientation = "bottom"

[bootstrap.macos.defaults."com.apple.dock"]
"persistent-apps" = []
"persistent-others" = []
"no-bouncing" = true

[bootstrap.macos.defaults.NSGlobalDomain]
CGDisableCursorLocationMagnification = true
_HIHideMenuBar = false
AppleMenuBarVisibleInFullscreen = true

[bootstrap.macos.defaults."com.apple.controlcenter"]
"NSStatusItem Visible AutoHide" = false

[bootstrap.directories."~/.local/share/zsh"]
[bootstrap.directories."~/.local/state/zsh"]
[bootstrap.directories."~/.tmux/plugins"]
[bootstrap.directories."~/.local/state/tmux/resurrect"]

[bootstrap.repos]
"~/.local/share/zsh-defer" = { url = "https://github.com/romkatv/zsh-defer.git" }

